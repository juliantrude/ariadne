[project]
name = "ariadne"
version = "0.2.3"
description = "Lernagent auf Basis von Claude Code: kennt den Weg, verrät ihn nicht."
requires-python = ">=3.12"
dependencies = ["fsrs>=6.3"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
